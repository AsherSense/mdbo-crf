<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MDBO RCT · CRF录入</title><style>
:root{--navy:#163f68;--blue:#246baf;--ink:#102a43;--line:#d7e2ea;--paper:#f4f8fb;--auto:#e7edf1;--manual:#edf6ff;--mint:#dff5ef;--warn:#fff2ca}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Microsoft YaHei",system-ui,sans-serif}header{background:var(--navy);color:#fff;padding:22px max(18px,calc((100% - 1180px)/2));display:flex;justify-content:space-between;gap:15px;align-items:center}h1{margin:0;font-size:1.35rem}header p{margin:3px 0 0;color:#cddfeb;font-size:.87rem}.badge{border:1px solid #8dcebf;border-radius:99px;padding:5px 10px;font-size:.78rem;white-space:nowrap;color:#d8fff5}main{max-width:1180px;margin:auto;padding:25px 18px 58px}.notice{border-left:4px solid #e1a920;background:var(--warn);padding:11px 14px;border-radius:8px;font-size:.9rem;margin-bottom:19px}.card,details{background:#fff;border:1px solid var(--line);border-radius:12px}.card{padding:22px}.card h2{font-size:1.1rem;margin:0}.sub{margin:3px 0 18px;color:#667b8f;font-size:.88rem}.identity{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}details{margin-top:12px;overflow:hidden}summary{cursor:pointer;padding:15px 18px;font-weight:700;background:#f8fbfd}details[open] summary{border-bottom:1px solid var(--line);background:var(--mint)}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:18px}label{display:block;font-weight:700;font-size:.82rem;margin-bottom:5px}input,select,textarea{width:100%;background:var(--manual);border:1px solid #aebfce;border-radius:8px;padding:10px;color:var(--ink);font:inherit}textarea{min-height:76px;resize:vertical}.auto{background:var(--auto);border-color:#cbd6df;color:#5a6b78}.hint{font-size:.79rem;color:#687d90;margin:7px 0 0}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px}.primary,.secondary{font:inherit;font-weight:700;border-radius:8px;padding:10px 16px;cursor:pointer}.primary{background:var(--blue);color:#fff;border:1px solid var(--blue)}.secondary{background:#fff;color:var(--blue);border:1px solid var(--blue)}.ok{display:none;color:#087b5a;font-weight:700;font-size:.9rem}.ok.show{display:block}@media(max-width:800px){header{align-items:flex-start;flex-direction:column}.identity,.fields{grid-template-columns:1fr}}
</style></head><body><header><div><h1>MDBO RCT · 患者 CRF 录入</h1><p>以住院号作为唯一识别码 · 字段与选项依据原始 Excel CRF</p></div><span class="badge">单入口 · 研究内部使用</span></header><main><div class="notice">所有下拉选项均来自 Excel 的 <b>CRF_字典</b>；灰色为系统/中央随机化自动项，不可填写。本页面不含真实患者数据存储功能。</div><form id="crf" class="card"><h2>完整 CRF 工作台</h2><p class="sub">住院号确定后，按时间顺序完成基线、手术、14天、定期随访、RBO、AE/SAE、生活质量、合并治疗和结局退出。</p><div class="identity"><div><label>住院号/病历号（唯一识别码）*</label><input required placeholder="例如 IP20260001"></div><div><label>随机号（自动）</label><input class="auto" readonly value="中央随机化锁定后生成"></div><div><label>受试者编号（自动）</label><input class="auto" readonly value="中央随机化锁定后生成"></div></div><div id="sections"></div><div class="actions"><button class="primary">保存 CRF 草稿</button><button class="secondary" type="reset">清空未保存内容</button><span class="ok" id="ok">已完成演示校验；生产版应写入受控数据库与审计日志。</span></div></form></main><script>
const O={YN:['是','否'],Sex:['男','女'],ECOG:['0','1','2'],Tumor:['胰腺癌','远端胆管癌','壶腹癌','胆囊癌','转移性淋巴结压迫','其他符合方案的恶性肿瘤'],Drain:['无','塑料支架','鼻胆管','其他'],Anes:['镇静','全麻','其他'],EST:['EST','ESBD','均未做'],Comp:['无','出血','穿孔','其他'],Follow:['门诊','电话','住院'],Improve:['明显改善','部分改善','无变化','加重'],Grade:['无','轻','中','重','致死'],Visit:['1月','3月','6月','12月'],Symptom:['无','黄疸','发热/寒战','腹痛','其他'],Imaging:['无','CT','MRI/MRCP','超声','其他'],Stent:['正常','可疑移位','明确移位'],Anti:['无','化疗','放疗','靶向/免疫治疗','其他'],Survival:['存活','死亡'],RBO:['支架闭塞','有症状支架移位','其他'],Occlusion:['肿瘤内生','末端过度生长','胆泥/食物嵌塞','血凝块','其他'],Migration:['部分-近端','部分-远端','完全-近端','完全-远端','NA'],Reintervention:['ERCP清洗','置入塑料支架','套叠金属支架','更换支架','外科/介入','其他'],SAE:['否','是-死亡','是-危及生命','是-住院/延长住院','是-致残','是-其他'],Related:['无关','可能相关','很可能相关','肯定相关'],Measure:['对症','抗生素','输血','内镜处理','外科/介入','其他'],Outcome:['痊愈','好转','未愈','后遗症','死亡'],Report:['不适用','24h内上报PI/DSMB/伦理','其他'],QoL:['QLQ-C30','QLQ-BIL21','两者'],QoLTime:['基线','3月','6月'],QoLMethod:['自填','访谈','代填'],NSAID:['未用','吲哚美辛','双氯芬酸','其他'],Exit:['未退出','撤回同意','技术失败','根治手术','SAE','失访','其他'],Death:['NA','肿瘤进展','支架相关并发症','其他']};
const S=[['01 · 筛选与基线（CRF01-02）',['筛选日期','姓名拼音首字母','年龄','性别','ECOG评分','原发肿瘤类型','TNM分期','梗阻位置距肝门距离(cm)','既往胆道引流史','TBIL(μmol/L)','ALP(U/L)','ALT(U/L)','AST(U/L)','WBC(×10^9/L)','血小板(×10^9/L)','INR','肌酐(μmol/L)','CA19-9(U/mL)','备注']],['02 · ERCP与支架（CRF03-04）',['手术日期','镇静/麻醉方式','EST/ESBD','是否置入鼻胆管','狭窄段长度(cm)','随机分组核对','支架厂家/型号','支架直径(mm)','支架长度(mm)','支架释放方式','技术成功','术中并发症','是否实施夹锚定','夹子品牌/型号','夹数量','远端外露(mm)','夹锚定备注','备注']],['03 · 术后14天（CRF05）',['访视日期','随访方式','症状改善','TBIL第14天(μmol/L)','临床成功(TBIL较基线下降≥50%)','30天内胰腺炎','30天内胆囊炎','30天内出血','30天内支架移位','支架移位需干预','合并治疗(如化疗)','合并治疗日期','备注']],['04 · 定期随访（CRF06）',['访视日期','访视时间点','随访日期','临床症状','TBIL(μmol/L)','ALP(U/L)','ALT(U/L)','AST(U/L)','影像学检查','支架位置','是否疑似RBO','抗肿瘤治疗','不良事件','生存状态','死亡日期','死亡原因','备注']],['05 · RBO与再干预（CRF07）',['访视日期','疑似RBO触发日期','RBO最终裁定','RBO类型(TOKYO2014)','闭塞原因','移位情况','夹在位','再干预方式','再干预日期','再干预技术成功','再干预并发症','备注']],['06 · 不良事件/SAE（CRF08）',['访视日期','事件名称','发生日期','严重程度','是否SAE','与研究器械/操作相关性','处理措施','转归','上报情况(SAE必填)','上报日期','备注']],['07 · 生活质量（CRF09）',['访视日期','量表类型','评估时间点','填写方式','是否完整','缺失条目数','代填说明','备注']],['08 · 合并治疗（CRF10）',['访视日期','围术期NSAIDs','NSAIDs其他说明','预防性胰管支架','胰管支架规格','围术期抗生素','抗生素药物/疗程','化疗方案','化疗开始日期','化疗结束日期','放疗','放疗开始日期','放疗结束日期','免疫/靶向治疗','免疫/靶向药物','备注']],['09 · 结局与退出（CRF11）',['访视日期','180天是否发生RBO','RBO日期','RBO类型','退出研究','退出原因','最后一次随访日期','死亡日期','死因','备注']]];
function opts(l){if(/性别/.test(l))return O.Sex;if(/ECOG/.test(l))return O.ECOG;if(/肿瘤类型/.test(l))return O.Tumor;if(/胆道引流/.test(l))return O.Drain;if(/麻醉/.test(l))return O.Anes;if(/EST/.test(l))return O.EST;if(/随访方式/.test(l))return O.Follow;if(/症状改善/.test(l))return O.Improve;if(/严重程度/.test(l))return O.Grade;if(/时间点/.test(l))return O.Visit;if(/临床症状/.test(l))return O.Symptom;if(/影像/.test(l))return O.Imaging;if(/支架位置/.test(l))return O.Stent;if(/抗肿瘤/.test(l)||/合并治疗/.test(l)||/放疗$/.test(l))return O.Anti;if(/生存状态/.test(l))return O.Survival;if(/RBO类型/.test(l))return O.RBO;if(/闭塞原因/.test(l))return O.Occlusion;if(/移位情况/.test(l))return O.Migration;if(/再干预方式/.test(l))return O.Reintervention;if(/是否SAE/.test(l))return O.SAE;if(/相关性/.test(l))return O.Related;if(/处理措施/.test(l))return O.Measure;if(/转归/.test(l))return O.Outcome;if(/上报情况/.test(l))return O.Report;if(/量表类型/.test(l))return O.QoL;if(/评估时间点/.test(l))return O.QoLTime;if(/填写方式/.test(l))return O.QoLMethod;if(/NSAIDs/.test(l))return O.NSAID;if(/退出原因/.test(l))return O.Exit;if(/死因|死亡原因/.test(l))return O.Death;if(/并发症|不良事件/.test(l))return O.Comp;if(/是否|成功|核对|夹在位|是否完整|疑似RBO|发生RBO|退出研究|知情|资格/.test(l))return O.YN;return null}
function field(l){let x=opts(l);let date=/日期|日期/.test(l);let num=/年龄|评分|距离|μmol|U\/L|10\^9|INR|CA19|长度|直径|数量|外露|缺失/.test(l);let tag=x?`<select><option value="">请选择</option>${x.map(v=>`<option>${v}</option>`).join('')}</select>`:date?'<input type="date">':/备注|说明|方案|型号|名称/.test(l)?'<textarea></textarea>':`<input type="${num?'number':'text'}" ${num?'min="0" step="0.1"':''}>`;return `<div><label>${l}</label>${tag}</div>`}document.getElementById('sections').innerHTML=S.map((s,i)=>`<details ${i===0?'open':''}><summary>${s[0]}</summary><div class="fields">${s[1].map(field).join('')}</div></details>`).join('');document.getElementById('crf').addEventListener('submit',e=>{e.preventDefault();document.getElementById('ok').classList.add('show')});
</script></body></html>
