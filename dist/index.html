<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MDBO RCT CRF</title><style>body{margin:0;background:#f4f8fb;color:#102a43;font:16px/1.5 Microsoft YaHei,sans-serif}header{background:#163f68;color:white;padding:22px calc((100% - 1100px)/2)}main{max-width:1100px;margin:auto;padding:22px}.card,details{background:#fff;border:1px solid #d7e2ea;border-radius:10px}.card{padding:20px}.notice{background:#fff2ca;border-left:4px solid #e1a920;padding:10px;margin-bottom:16px}.identity,.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.fields{padding:16px}details{margin-top:12px}summary{padding:14px;font-weight:bold;background:#dff5ef;cursor:pointer}label{display:block;font-size:.84rem;font-weight:bold;margin-bottom:4px}input,select,textarea{box-sizing:border-box;width:100%;padding:9px;border:1px solid #aebfce;border-radius:7px;background:#edf6ff;font:inherit}textarea{min-height:65px}.auto{background:#e7edf1}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}button{padding:10px 15px;border-radius:7px;border:1px solid #246baf;background:#fff;color:#246baf;font-weight:bold}.primary{background:#246baf;color:#fff}.ok{color:#087b5a;font-weight:bold}.hint{color:#667b8f;font-size:.86rem}@media(max-width:700px){header{padding:18px}.identity,.fields{grid-template-columns:1fr}}</style><body><header><h1>MDBO RCT · 患者 CRF 录入</h1><div>以住院号作为唯一识别码 · 字段与选项依据原始 Excel CRF</div></header><main><div class="notice">下拉选项来自原始 Excel CRF；灰色为自动生成项。草稿仅保存于当前设备的当前浏览器。</div><form class="card" id="crf"><h2>完整 CRF 工作台</h2><div class="identity"><div><label>住院号/病历号（唯一识别码）*</label><input required placeholder="例如 IP20260001"></div><div><label>随机号（自动）</label><input class="auto" readonly value="中央随机化锁定后生成"></div><div><label>受试者编号（自动）</label><input class="auto" readonly value="中央随机化锁定后生成"></div></div><div id="sections"></div><div class="actions"><button class="primary" type="button" id="save">保存至本浏览器草稿</button><button type="button" id="export">导出本次CRF（CSV）</button><button type="reset">清空未保存内容</button></div><p class="hint">导出文件保存到浏览器默认“下载”文件夹，可直接用 WPS/Excel 打开。</p><p class="ok" id="ok"></p></form></main><script>
const S=[['01 筛选与基线（CRF01-02）','筛选日期,姓名拼音首字母,年龄,性别,ECOG评分,原发肿瘤类型,TNM分期,梗阻位置距肝门距离(cm),既往胆道引流史,TBIL(μmol/L),ALP(U/L),ALT(U/L),AST(U/L),WBC(×10^9/L),血小板(×10^9/L),INR,肌酐(μmol/L),CA19-9(U/mL),备注'],['02 ERCP与支架（CRF03-04）','手术日期,镇静/麻醉方式,EST/ESBD,是否置入鼻胆管,狭窄段长度(cm),随机分组核对,支架厂家/型号,支架直径(mm),支架长度(mm),支架释放方式,技术成功,术中并发症,是否实施夹锚定,夹子品牌/型号,夹数量,远端外露(mm),夹锚定备注,备注'],['03 术后14天（CRF05）','访视日期,随访方式,症状改善,TBIL第14天(μmol/L),临床成功(TBIL较基线下降≥50%),30天内胰腺炎,30天内胆囊炎,30天内出血,30天内支架移位,支架移位需干预,合并治疗(如化疗),合并治疗日期,备注'],['04 定期随访（CRF06）','访视日期,访视时间点,随访日期,临床症状,TBIL(μmol/L),ALP(U/L),ALT(U/L),AST(U/L),影像学检查,支架位置,是否疑似RBO,抗肿瘤治疗,不良事件,生存状态,死亡日期,死亡原因,备注'],['05 RBO与再干预（CRF07）','访视日期,疑似RBO触发日期,RBO最终裁定,RBO类型(TOKYO2014),闭塞原因,移位情况,夹在位,再干预方式,再干预日期,再干预技术成功,再干预并发症,备注'],['06 不良事件/SAE（CRF08）','访视日期,事件名称,发生日期,严重程度,是否SAE,与研究器械/操作相关性,处理措施,转归,上报情况(SAE必填),上报日期,备注'],['07 生活质量（CRF09）','访视日期,量表类型,评估时间点,填写方式,是否完整,缺失条目数,代填说明,备注'],['08 合并治疗（CRF10）','访视日期,围术期NSAIDs,NSAIDs其他说明,预防性胰管支架,胰管支架规格,围术期抗生素,抗生素药物/疗程,化疗方案,化疗开始日期,化疗结束日期,放疗,放疗开始日期,放疗结束日期,免疫/靶向治疗,免疫/靶向药物,备注'],['09 结局与退出（CRF11）','访视日期,180天是否发生RBO,RBO日期,RBO类型,退出研究,退出原因,最后一次随访日期,死亡日期,死因,备注']];
const pick=(l)=>/性别/.test(l)?'男|女':/ECOG/.test(l)?'0|1|2':/原发肿瘤/.test(l)?'胰腺癌|远端胆管癌|壶腹癌|胆囊癌|转移性淋巴结压迫|其他符合方案的恶性肿瘤':/胆道引流/.test(l)?'无|塑料支架|鼻胆管|其他':/麻醉/.test(l)?'镇静|全麻|其他':/EST/.test(l)?'EST|ESBD|均未做':/随访方式/.test(l)?'门诊|电话|住院':/症状改善/.test(l)?'明显改善|部分改善|无变化|加重':/严重程度/.test(l)?'无|轻|中|重|致死':/时间点/.test(l)?'1月|3月|6月|12月':/临床症状/.test(l)?'无|黄疸|发热/寒战|腹痛|其他':/影像/.test(l)?'无|CT|MRI/MRCP|超声|其他':/支架位置/.test(l)?'正常|可疑移位|明确移位':/生存状态/.test(l)?'存活|死亡':/是否SAE/.test(l)?'否|是-死亡|是-危及生命|是-住院/延长住院|是-致残|是-其他':/相关性/.test(l)?'无关|可能相关|很可能相关|肯定相关':/转归/.test(l)?'痊愈|好转|未愈|后遗症|死亡':/退出原因/.test(l)?'未退出|撤回同意|技术失败|根治手术|SAE|失访|其他':/是否|成功|核对|夹在位|完整|疑似|发生RBO|退出研究/.test(l)?'是|否':'';
function field(l){let p=pick(l),date=/日期/.test(l),num=/年龄|评分|距离|μmol|U\/L|10\^9|INR|CA19|长度|直径|数量|外露|缺失/.test(l),t=p?`<select><option value="">请选择</option>${p.split('|').map(x=>`<option>${x}</option>`).join('')}</select>`:date?'<input type=date>':/备注|说明|方案|型号|名称/.test(l)?'<textarea></textarea>':`<input type=${num?'number':'text'}>`;return `<div><label>${l}</label>${t}</div>`}sections.innerHTML=S.map((x,i)=>`<details ${i?'':'open'}><summary>${x[0]}</summary><div class=fields>${x[1].split(',').map(field).join('')}</div></details>`).join('');const store='mdbo-crf-draft-v1',manual=()=>[...crf.querySelectorAll('input:not([readonly]),select,textarea')],all=()=>[...crf.querySelectorAll('input,select,textarea')],say=x=>ok.textContent=x;try{let d=JSON.parse(localStorage.getItem(store)||'null');if(d?.data){manual().forEach((e,i)=>e.value=d.data[i]||'');say('已加载本浏览器草稿：'+d.savedAt)}}catch{}save.onclick=()=>{if(!manual()[0].value.trim())return say('请先填写住院号/病历号。');localStorage.setItem(store,JSON.stringify({savedAt:new Date().toLocaleString('zh-CN'),data:manual().map(e=>e.value)}));say('已保存至本浏览器草稿（仅此设备/浏览器可见）。')};export.onclick=()=>{let rows=[['字段','填写内容'],...all().map(e=>[e.closest('div').querySelector('label')?.textContent||'',e.value])],csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='MDBO_CRF_'+(manual()[0].value||'未命名')+'.csv';a.click();say('已导出 CSV，请在浏览器默认“下载”文件夹中查看。')};crf.addEventListener('reset',()=>setTimeout(()=>say('已清空未保存内容；草稿未删除。')));
</script>
